name: Write quota regressions
on:
  pull_request:
    paths:
      - 'supabase/**'
      - 'src/lib/write-quota.ts'
      - 'tests/write-quota.test.mjs'
      - '.github/workflows/write-quotas.yml'
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: write_quotas_fixture
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: fixture-only
      PGDATABASE: write_quotas_fixture
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Bootstrap disposable fixture and apply proposed migration
        run: |
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/write-quotas-fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261006234128_enforce_client_write_quotas.sql
      - name: Quota rejection, recovery, and counter privileges
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/write-quotas.sql
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: HTTP quota response regressions
        run: node --experimental-strip-types --test tests/write-quota.test.mjs
