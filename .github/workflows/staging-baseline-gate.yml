name: Staging baseline gate
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: staging-baseline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  baseline:
    name: R1 schema / staging readiness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STAGING_PROJECT_REF: otmaxtjstvbfckpgbwdi
      PRODUCTION_PROJECT_REF: idtnlninotxwqpznbwur
    steps:
      - uses: actions/checkout@v4
      - name: Verify migration sources and isolation contract
        shell: bash
        run: |
          set -euo pipefail
          test "$STAGING_PROJECT_REF" != "$PRODUCTION_PROJECT_REF"
          test -d supabase/migrations
          test -f supabase/tests/production-release-preflight.sql
          python3 - <<'PY'
          from pathlib import Path
          import json, os
          migrations=sorted(Path('supabase/migrations').glob('*.sql'))
          assert migrations, 'No migration SQL files found'
          versions=[p.name.split('_',1)[0] for p in migrations]
          assert len(versions)==len(set(versions)), 'Duplicate migration versions'
          assert all(len(v)==14 and v.isdigit() for v in versions), 'Invalid migration version'
          Path('baseline-gate.json').write_text(json.dumps({'commit':os.getenv('GITHUB_SHA'),'migration_count':len(migrations),'migration_versions':versions,'staging_ref':os.environ['STAGING_PROJECT_REF'],'production_ref':os.environ['PRODUCTION_PROJECT_REF']},indent=2))
          PY
      - name: R1 live schema gate
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${STAGING_DATABASE_URL:-}" ]; then
            echo "::error title=BLOCKED R1::STAGING_DATABASE_URL secret is missing; live schema cannot be verified"
            exit 1
          fi
          python3 - <<'PY'
          import os,sys
          from urllib.parse import urlparse
          u=urlparse(os.environ['STAGING_DATABASE_URL'])
          host=(u.hostname or '').lower()
          if host != 'db.otmaxtjstvbfckpgbwdi.supabase.co':
              print('::error title=BLOCKED R1::Database host is not the approved staging host')
              sys.exit(1)
          PY
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client >/dev/null
          count=$(psql "$STAGING_DATABASE_URL" -X -A -t -v ON_ERROR_STOP=1 -c "select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relkind in ('r','p')")
          if [ "$count" -eq 0 ]; then
            echo "::error title=FAIL R1::Staging has zero public application tables; baseline restore required"
            exit 1
          fi
          psql "$STAGING_DATABASE_URL" -X -v ON_ERROR_STOP=1 -c "select relname, relrowsecurity from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relkind in ('r','p') and not c.relrowsecurity" | tee missing-rls.txt
          missing=$(psql "$STAGING_DATABASE_URL" -X -A -t -v ON_ERROR_STOP=1 -c "select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relkind in ('r','p') and not c.relrowsecurity")
          if [ "$missing" -gt 0 ]; then
            echo "::error title=FAIL R3::Public tables without RLS detected"
            exit 1
          fi
          echo "::error title=BLOCKED R1::Found tables, but full schema parity and role tests are not yet implemented; fail closed"
          exit 1
      - name: Upload non-secret inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-baseline-inventory
          path: |
            baseline-gate.json
            missing-rls.txt
          if-no-files-found: ignore
