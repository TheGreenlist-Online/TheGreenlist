name: Role RPC regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  role-rpc:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: disposable-test-only
          POSTGRES_DB: role_rpc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: disposable-test-only
      PGDATABASE: role_rpc_test
    steps:
      - uses: actions/checkout@v4
      - name: Test role RPC in an isolated database
        run: |
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/role-rpc-fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261006234138_restrict_cross_user_role_rpc.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/role-rpc.sql
